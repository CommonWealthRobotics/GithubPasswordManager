name: Test Build

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GithubPasswordManager
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '25'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.1.0'

    - name: Test with Gradle
      run: gradle --no-daemon test

  # Catch dependency changes that would make the lockfile inconsistent.
  # Regenerate after a dependency change and commit the result:
  #   cd GithubPasswordManager && ./gradlew --write-locks lockClasspaths
  lockfile-drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GithubPasswordManager
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '25'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.1.0'

    - name: Regenerate lockfiles
      run: gradle --no-daemon --write-locks lockClasspaths

    - name: Fail if lockfile changed
      run: |
        if ! git diff --exit-code -- '**/gradle.lockfile' 'gradle.lockfile'; then
          echo "::error::gradle.lockfile is out of date. Regenerate it and commit the result:"
          echo "  gradle --write-locks lockClasspaths"
          exit 1
        fi
